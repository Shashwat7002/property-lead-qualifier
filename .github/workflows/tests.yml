name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
      - name: Install application and ML dependencies
        run: python -m pip install -r requirements-ml.txt pytest
      - name: Test lead workflow and ML methodology
        run: python -m pytest -q
